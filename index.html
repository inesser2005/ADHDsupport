<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADHDsupport</title>
    <!-- css -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/CSS/style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-md py-3 shadow-sm border-0">
      <div class="container-fluid max-w-1200 px-4">
        <!-- Logótipo alinhado à esquerda -->
        <a class="navbar-brand logo fw-bold m-0" href="#">ADHDsupport</a>

        <!-- Crachá do Temporizador Global (aparece discretamente ao lado do logótipo) -->
        <div id="global-timer-badge" class="global-timer hidden ms-3">
          <i class="bi bi-hourglass-split"></i>
          <span id="global-timer-text">25:00</span>
        </div>

        <!-- Grupo de links empurrado automaticamente para a direita através da classe ms-auto -->
        <div class="ms-auto">
          <ul class="nav nav-pills align-items-center gap-2" id="nav-links">
            <!-- Esta lista será preenchida dinamicamente pelo teu JavaScript (nav.js) -->
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="pomodoro-container">
        <!-- Mostrar o modo atual (Foco ou Pausa) -->
        <h2 id="timer-mode">Modo Foco</h2>

        <!-- Exibição do Objetivo Ativo -->
        <div id="goal-display-group" class="goal-display-group hidden">
          <p class="goal-label">
            <i class="bi bi-bullseye"></i> Objetivo Atual:
          </p>
          <div class="goal-text-wrapper">
            <span id="active-goal-text"></span>
            <button id="edit-goal-btn" title="Editar objetivo">
              <i class="bi bi-pencil"></i>
            </button>
          </div>
        </div>

        <!-- Mostrador do Tempo -->
        <div class="timer-display" id="timer-display">25:00</div>

        <!-- Contador de Sessões -->
        <div class="session-counter">
          <p>Sessões de Foco Concluídas: <span id="session-count">0</span></p>
        </div>
        <br />
        <!-- Controlo de Modos (Botões Rápidos) -->
        <div class="mode-buttons">
          <button id="focus-btn" class="active-mode">Foco (25m)</button>

          <button id="short-break-btn">Pausa Curta (5m)</button>

          <button id="long-break-btn">Pausa Longa (15m)</button>
        </div>

        <!-- Botões de Ação -->
        <div class="action-buttons">
          <button id="start-btn">Iniciar</button>

          <button id="pause-btn" disabled>Pausar</button>

          <button id="reset-btn">Reiniciar</button>
        </div>
      </div>
    </div>

    <!-- Janela modal pra definir Objetivo da sessão -->
    <!-- MODAL NORMAL E CORRIGIDO (BOOTSTRAP 6) -->
    <dialog id="goal-modal" class="dialog rounded-7 border-0 shadow p-4">
      <!-- Botão Fechar (X) no topo direito -->
      <div class="d-flex justify-content-end">
        <button
          type="button"
          class="btn-close"
          id="close-modal-x"
          aria-label="Fechar"
        ></button>
      </div>

      <!-- Corpo do Modal -->
      <div class="dialog-body text-center pt-0">
        <div class="fs-1 mb-2">🎯</div>
        <h3 class="dialog-title fs-3 fw-medium mb-2 text-dark">
          Define o teu Objetivo
        </h3>
        <p class="text-secondary small mb-4">
          O que vais tentar concluir nesta sessão de foco?
        </p>

        <!-- Input com cantos suaves integrado no tema -->
        <input
          type="text"
          id="goal-input"
          class="form-control border-0 bg-light rounded-3 py-2.5 px-3 mb-3"
          placeholder="Ex: Estudar capítulo 3 de T"
        />
        <p id="error-msg" class="error-msg d-none mb-3 small text-danger">
          Por favor, define um objetivo válido.
        </p>
      </div>

      <!-- Botões de Ação Inferiores -->
      <div
        class="dialog-footer d-flex gap-2 justify-content-center border-0 p-0"
      >
        <!-- btn-solid assume o roxo/azul/vermelho ativo automaticamente -->
        <button
          type="button"
          id="confirm-goal-btn"
          class="btn btn-solid btn-primary px-4 py-2 fw-semibold text-white rounded-3 border-0"
        >
          Começar Foco
        </button>
        <button
          type="button"
          id="cancel-goal-btn"
          class="btn btn-light px-4 py-2 fw-semibold text-secondary rounded-3 border-0 align-items-right"
        >
          Cancelar
        </button>
      </div>
    </dialog>

    <!-- Ligação ao BootstrapJS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- Ligação ao script da Navbar -->
    <script src="comp/nav.js" defer></script>
    <!-- Ligação ao script do timer -->
    <script src="comp/timer.js" defer></script>
    <!-- Ligação ao script das settings -->
    <script src="comp/settings.js" defer></script>
  </body>
</html>
