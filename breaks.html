<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Breaks - ADHDsupport</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-md py-3 shadow-sm border-0">
      <div class="container-fluid max-w-1200 px-4">
        <!-- Logótipo alinhado à esquerda -->
        <a class="navbar-brand logo fw-bold m-0" href="#">ADHDsupport</a>

        <!-- Crachá do Temporizador Global (aparece discretamente ao lado do logótipo) -->
        <div id="global-timer-badge" class="global-timer hidden ms-3">
          <i class="bi bi-hourglass-split"></i>
          <span id="global-timer-text">25:00</span>
        </div>

        <!-- Grupo de links empurrado automaticamente para a direita através da classe ms-auto -->
        <div class="ms-auto">
          <ul class="nav nav-pills align-items-center gap-2" id="nav-links">
            <!-- Esta lista será preenchida dinamicamente pelo teu JavaScript (nav.js) -->
          </ul>
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="container py-5" style="max-width: 1000px">
      <!-- PAGE HEADER -->
      <header class="mb-5">
        <p class="text-body-secondary small mb-2">DESCOMPRESSING SPACE</p>
        <h1 class="h2 fw-semibold mb-2">Take a breather.</h1>
      </header>

      <!-- DASHBOARD GRID -->
      <div class="row g-4">
        <!-- TASKS CARD (Alinhado para ser responsivo com col-12 col-md-6) -->
        <section class="col-12 col-md-6">
          <div
            class="card bg-body text-body border-0 shadow-sm rounded-4 h-100"
          >
            <div class="card-body p-4">
              <div class="d-flex align-items-center gap-3 mb-3">
                <div
                  class="rounded-3 p-3"
                  style="background-color: var(--input-bg)"
                >
                  <i class="bi bi-emoji-smile fs-4" aria-hidden="true"></i>
                </div>

                <div>
                  <h2 class="h5 mb-1">A little distraction</h2>
                  <p class="text-body-secondary small mb-0">
                    A light activity to help you unwind.
                  </p>
                </div>
              </div>

              <!-- Output da API de piadas -->
              <div id="jokesAPI" class="d-flex flex-column gap-3">
                <p class="text-body-secondary small mb-0">
                  Loading your jokes to descompress...
                </p>
              </div>
            </div>
          </div>
        </section>

        <!-- MUSIC PLAYER CARD (Alinhado com col-12 col-md-6) -->
        <section class="col-12 col-md-6">
          <div
            class="card bg-body text-body border-0 shadow-sm rounded-4 h-100"
          >
            <div class="card-body p-4">
              <div class="d-flex align-items-center gap-3 mb-3">
                <div
                  class="rounded-3 p-3"
                  style="background-color: var(--input-bg)"
                >
                  <i
                    class="bi bi-music-note-beamed fs-4"
                    aria-hidden="true"
                  ></i>
                </div>
                <div>
                  <h2 class="h5 mb-1">Música ambiente</h2>
                  <p class="text-body-secondary small mb-0">
                    Gere o teu momento de calma.
                  </p>
                </div>
              </div>

              <!-- Controlos de Faixa e Volume locais -->
              <div class="d-flex flex-column gap-3 mb-4">
                <div>
                  <label
                    for="song-select"
                    class="form-label text-body fw-medium small mb-1"
                    >Selecionar Som de Fundo:</label
                  >
                  <select
                    id="song-select"
                    class="form-select border-0 bg-body-tertiary rounded-3 py-2 px-3"
                  >
                    <option value="none">Nenhuma</option>
                    <option value="jazz">Persona 5 Royal Jazz</option>
                    <option value="radiohead">Treefingers</option>
                    <option value="lofi">Lo-fi Rainy day</option>
                  </select>
                </div>

        
              <hr class="my-4" />

              <!-- Contentor onde o iframe é injetado pelo breaks.js -->
              <div id="music-container" class="w-100">
                <!-- Injetado via JavaScript -->
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- JOKE DETAILS MODAL -->
    <div
      class="modal fade"
      id="detalhesModal"
      tabindex="-1"
      aria-labelledby="modalTitulo"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-body text-body border-0 rounded-4 shadow">
          <div class="modal-header border-0">
            <h2 class="modal-title fs-5" id="modalTitulo">Detalhes da piada</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>

          <div class="modal-body">
            <p id="modalPiada"></p>
            <small id="modalId" class="text-body-secondary"></small>
          </div>

          <div class="modal-footer border-0">
            <button
              type="button"
              class="btn btn-primary rounded-pill px-4"
              data-bs-dismiss="modal"
            >
              Fechar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="comp/nav.js" defer></script>
    <script src="comp/breaks.js" defer></script>
    <script src="API/bored_API.js" defer></script>
    <script src="comp/settings.js" defer></script>
  </body>
</html>
