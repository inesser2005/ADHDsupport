<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADHDsupport</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-md py-3 shadow-sm border-0">
      <div class="container-fluid max-w-1200 px-4">
        <!-- Logótipo alinhado à esquerda -->
        <a class="navbar-brand logo fw-bold m-0" href="#">ADHDsupport</a>

        <!-- Crachá do Temporizador Global (aparece discretamente ao lado do logótipo) -->
        <div id="global-timer-badge" class="global-timer hidden ms-3">
          <i class="bi bi-hourglass-split"></i>
          <span id="global-timer-text">25:00</span>
        </div>

        <!-- Grupo de links empurrado automaticamente para a direita através da classe ms-auto -->
        <div class="ms-auto">
          <ul class="nav nav-pills align-items-center gap-2" id="nav-links">
            <!-- Esta lista será preenchida dinamicamente pelo teu JavaScript (nav.js) -->
          </ul>
        </div>
      </div>
    </nav>
    <!-- Definições -->
    <main class="d-flex align-items-center justify-content-center py-5">
      <div class="container" style="max-width: 600px">
        <div class="card shadow border-0 bg-body rounded-7 p-4 py-5">
          <h2 class="mb-5 text-center fw-normal text-body-secondary">
            Definições
          </h2>

          <ul class="list-group list-group-flush mb-4 bg-transparent">
            <!-- Tema -->
            <li class="list-group-item border-0 bg-transparent px-0 py-3">
              <div
                class="d-flex justify-content-between align-items-center gap-3"
              >
                <label
                  for="theme-toggle-btn"
                  class="form-label mb-0 text-body fw-medium"
                >
                  Modo claro/escuro
                </label>

                <button
                  type="button"
                  id="theme-toggle-btn"
                  class="btn btn-sm btn-outline-secondary px-4 py-2 rounded-3"
                >
                  Alternar tema
                </button>
              </div>
            </li>

            <!-- Esquema de cores -->
            <li class="list-group-item border-0 bg-transparent px-0 py-3">
              <div class="d-flex flex-column gap-2">
                <label
                  for="color-scheme-select"
                  class="form-label text-body fw-medium mb-0"
                >
                  Esquema de cores
                </label>

                <select
                  id="color-scheme-select"
                  class="form-select border-0 bg-body-tertiary rounded-3 py-2 px-3"
                >
                  <option value="default">
                    Vermelho Pomodoro (predefinido)
                  </option>
                  <option value="blue">Azul Foco</option>
                  <option value="purple">Roxo Criativo</option>
                </select>
              </div>
            </li>

            <!-- Duração do foco -->
            <li class="list-group-item border-0 bg-transparent px-0 py-3">
              <div class="d-flex flex-column gap-2">
                <label
                  for="default-focus-time"
                  class="form-label text-body fw-medium mb-0"
                >
                  Duração da sessão de foco (minutos)
                </label>

                <input
                  type="number"
                  id="default-focus-time"
                  class="form-control border-0 bg-body-tertiary rounded-3 py-2 px-3"
                  min="1"
                  max="60"
                  step="1"
                  value="25"
                  required
                />
              </div>
            </li>

           
            <!-- Animações -->
            <li class="list-group-item border-0 bg-transparent px-0 py-3">
              <div
                class="form-check form-switch d-flex justify-content-between align-items-center ps-0"
              >
                <label
                  for="animations-toggle"
                  class="form-check-label text-body fw-medium"
                >
                  Ativar animações e transições
                </label>

                <input
                  type="checkbox"
                  id="animations-toggle"
                  class="form-check-input ms-3"
                  role="switch"
                  checked
                />
              </div>
            </li>

            
          <!-- Guardar -->
          <button
            type="button"
            id="save-all-settings"
            class="btn btn-primary w-100 py-3 rounded-3 fw-semibold border-0 shadow-sm mt-3"
          >
            Guardar definições
          </button>
        </div>
      </div>
    </main>

    <!-- Ligação ao BootstrapJS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- Ligação ao script da Navbar e das definições -->
    <script src="comp/nav.js" defer></script>
    <script src="comp/settings.js" defer></script>
  </body>
</html>
